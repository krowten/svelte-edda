name: Release

# Stages a release on npm when a `v*` tag is pushed; a maintainer then approves it on
# npmjs.com (Staged Packages) with 2FA. The tag must match `version` in package.json.
# npm authenticates through trusted publishing (OIDC, `id-token: write`); no token is stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # signs the npm provenance statement
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # browsers and their system libraries preinstalled; the image's Node 24 runs npm
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-resolute
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      # the container runs as root over a checkout owned by the runner user, and checkout marks it
      # safe only for its own steps: without this git refuses it, and the tests lose page dates
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm install --global bun npm@latest
      # no `node-version`: only writes the registry auth for the image's own Node
      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      # the tag may point at a commit CI never ran on, and `prepublishOnly` has no browser tests
      - run: bunx playwright install chromium
      - run: bun run test:e2e
      # staged, not published: a maintainer approves it on npmjs.com with 2FA.
      # `prepublishOnly` runs lint, type checks, tests and the packed-tarball smoke test first.
      - run: npm stage publish --provenance --access public
        env:
          # lets scripts/guard-publish.ts through: only this workflow may target the public registry
          SVELTE_EDDA_NPM_RELEASE: '1'
