name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or PR makes the running checks moot
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun src/cli.ts check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the whole range `engines.node` claims: maintenance LTS and active LTS
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: bun install --frozen-lockfile
      - run: bun test
      # the CLI users get from npm runs under Node: build the fixture site with it
      - run: bun run build
      - run: node dist/cli.js build --root test/fixtures/basic

  # The Playwright image ships the browsers with their system libraries, which
  # `playwright install --with-deps` would otherwise pull through apt on every run.
  # shortcut: the tag is bumped by hand with @playwright/test; a mismatch only costs a download
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-resolute
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      # setup-bun needs unzip, which the image lacks; npm brings the same binary
      - run: npm install --global bun
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # the published artifact, not the working tree: `files`, `exports` and the engine's own
  # source paths only meet reality once something installs the tarball by name
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run smoke:pack
      - run: bun run lint:package
