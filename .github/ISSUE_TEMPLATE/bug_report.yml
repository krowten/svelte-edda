name: Bug report
description: Something in svelte-edda doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal repository, or the smallest Markdown and config that show the problem.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: svelte-edda, Bun or Node, operating system
      placeholder: svelte-edda 0.1.0, Bun 1.4.4, Linux
    validations:
      required: true
